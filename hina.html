     上の安全域は site.css の env(safe-area-inset-top) で空けてある。

<style>
/* ---------------- 級の記録 ---------------- */

/* あがってきた道 (ぜんたい図。すべらせずに 1 枚で見る) */
.k-chart-wrap {
  background: var(--kami-2); border: 1px solid var(--sen); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 8px 6px 4px; position: relative;
}
.k-chart { display: block; width: 100%; height: auto; overflow: visible; }
.k-chart .ax { font-size: 10px; fill: var(--usu); font-weight: 600; }
.k-chart .ax.is-ima { font-size: 11.5px; font-weight: 800; }
.k-chart .ax-g { font-size: 11px; font-weight: 800; }
.k-chart .grid { stroke: rgba(0, 0, 0, .07); stroke-width: 1; }
.k-chart .grid.is-tsugi { stroke-dasharray: 2 4; stroke: rgba(0, 0, 0, .18); }
.k-chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.k-chart .dot { stroke-width: 2; }
.k-chart .hit { fill: transparent; cursor: pointer; }
.k-chart .ima-t { font-size: 11px; font-weight: 800; }
.k-chart .ev-koma { fill: #e2c47c; stroke: #a8873e; stroke-width: 1; stroke-linejoin: round; }
.k-chart .ev-moji { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 8px; font-weight: 700; fill: #4a3410; }
.k-tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--sumi); color: #fff; font-size: .74rem; line-height: 1.6;
  padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -135%);
}

/* 学年ごとの歩み (横にすべらせる大きいグラフ) */
.michi-wrap {
  background: var(--kami-2); border: 1px solid var(--sen); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: calc(env(safe-area-inset-top) + 12px);
}
.michi-scroll { overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.michi { display: block; }
.michi-box { position: relative; }
.michi-axis {
  position: absolute; left: 0; top: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(255, 255, 255, .95) 70%, rgba(255, 255, 255, 0));
}
.michi-axis .mi-ax { font-size: 11px; font-weight: 700; fill: var(--usu); }
.michi-axis .mi-ax.is-ima { font-size: 12.5px; font-weight: 800; }
.michi-axis .mi-ax.is-tsugi { opacity: .6; }
.michi .mi-tsugi { stroke-width: 1.5; stroke-dasharray: 2 5; opacity: .55; }
.michi .mi-tsugi-t { font-size: 12px; font-weight: 800; }
.michi .mi-grid { stroke: rgba(0, 0, 0, .05); stroke-width: 1; }
.michi .mi-sakai { stroke-width: 1; stroke-dasharray: 3 4; opacity: .5; }
.michi .mi-nen { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 19px; font-weight: 700; }
.michi .mi-sum { font-size: 11px; font-weight: 500; fill: var(--sumi-2); }
.michi .mi-line { fill: none; stroke-width: 3; stroke-linecap: round; }
.michi .mi-line.is-ima { stroke-dasharray: 5 6; }
.michi .mi-dot { fill: var(--kami-2); stroke: var(--gi, var(--shu)); stroke-width: 3.5; }
.michi .is-ima .mi-dot { fill: var(--gi, var(--shu)); }
.michi .mi-rank { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 16px; font-weight: 700; fill: var(--sumi); }
.michi .is-ima .mi-rank { fill: var(--gi, var(--shu)); }
.michi .mi-date { font-size: 12px; font-weight: 700; fill: var(--sumi-2); }
.michi .mi-year { font-size: 9px; font-weight: 500; fill: var(--usu); }
.michi .mi-memo { font-size: 10.5px; font-weight: 500; fill: var(--sumi-2); }
.michi .mi-stay { font-size: 12px; font-weight: 700; fill: var(--usu); }
.michi .is-ima .mi-stay { fill: var(--gi, var(--shu)); }
.michi .mi-pill text { font-size: 10px; font-weight: 700; }
.michi .mi-pill.is-start rect { fill: var(--gi, var(--shu)); } .michi .mi-pill.is-start text { fill: #fff; }
.michi .mi-pill.is-ima rect { fill: var(--gi, var(--shu)); } .michi .mi-pill.is-ima text { fill: #fff; }
.michi .mi-pill.is-fast rect, .michi .mi-pill.is-hayai rect { fill: #fff; stroke: #ecc5bf; } .michi .mi-pill.is-fast text, .michi .mi-pill.is-hayai text { fill: var(--shu); }
.michi .mi-pill.is-nagai rect { fill: #fff; stroke: #bdd0e4; } .michi .mi-pill.is-nagai text { fill: var(--ai); }
.michi .mi-ev-koma { fill: url(#kin); stroke: #a8873e; stroke-width: 1.5; stroke-linejoin: round; }
.michi .mi-ev-moji { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 14px; font-weight: 700; fill: #4a3410; }
.michi .mi-ev-pole { stroke: #a8873e; stroke-width: 1.5; stroke-dasharray: 2 3; }
.michi .mi-ev-name { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 14px; font-weight: 700; fill: #7a5a18; }
.michi .mi-ev-kekka { font-size: 12px; font-weight: 800; fill: #8a7550; }
/* 大会・タイトル戦の一覧 */
.k-ev { list-style: none; margin: 0; padding: 0; }
.k-ev li {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: linear-gradient(90deg, #fbf3dc, var(--kami-2) 60%); border: 1px solid #e6d5a0; border-radius: 12px;
}
.k-ev li + li { margin-top: 8px; }
.k-hata { flex: none; width: 30px; height: 34px; position: relative; }
.k-hata::before { content: ""; position: absolute; left: 8px; top: 2px; bottom: 2px; width: 2.5px; border-radius: 2px; background: #8a7550; }
.k-hata::after { content: ""; position: absolute; left: 10px; top: 3px; border-style: solid; border-width: 8px 0 8px 17px; border-color: transparent transparent transparent var(--hi); }
.k-cup { flex: none; width: 30px; text-align: center; font-size: 1.7rem; line-height: 1; }
.k-chart .ev-cup { font-size: 15px; }
.k-chart .ev-pole { stroke: #a8873e; stroke-width: 1; stroke-dasharray: 1.5 2; }
.michi .mi-ev-cup { font-size: 28px; }
.k-ev li.is-nyusho { background: linear-gradient(90deg, #f3ecd9, var(--kami-2) 60%); }
.k-ev li.is-yusho { background: linear-gradient(90deg, #f6e4a8, #fbf3dc 55%, var(--kami-2)); border-color: #c9a65a; box-shadow: 0 0 0 1px rgba(201, 166, 90, .35), var(--shadow); }
.k-koma {                     /* 金の駒の形 */
  flex: none; width: 30px; height: 36px; display: grid; place-items: end center; padding-bottom: 6px;
  font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; color: #4a3410;
  background: linear-gradient(180deg, #f2dc9a, #c9a65a);
  clip-path: polygon(50% 0, 88% 20%, 100% 100%, 0 100%, 12% 20%);
}
.k-ev-b b { display: block; font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.05rem; color: #7a5a18; }
.k-ev-b span { font-size: .72rem; font-weight: 500; color: var(--usu); }
.michi-nav { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--sen); }
.michi-btn {
  font: inherit; font-size: .74rem; color: var(--sumi-2); cursor: pointer; padding: 5px 12px;
  border: 1px solid var(--sen-2); border-radius: 999px; background: var(--kami);
}
.michi-hint { flex: 1; text-align: center; font-size: .66rem; font-weight: 500; color: var(--usu); }

/* つぎの級までのめやす */
.k-goal { margin: 12px auto 0; max-width: 300px; }
.k-goal-t { font-size: .82rem; color: var(--sumi-2); }
.k-goal-t b { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.15rem; color: var(--sumi); margin-left: 2px; }
.k-goal-bar { height: 8px; border-radius: 4px; background: var(--kami-3); margin-top: 6px; overflow: hidden; }
.k-goal-bar i { display: block; height: 100%; border-radius: 4px; background: var(--shu); opacity: .7; }
.k-goal-n { font-size: .68rem; font-weight: 500; color: var(--usu); margin-top: 4px; }

.k-now {
  text-align: center; background: var(--kami-2); border: 1px solid var(--sen);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 12px 14px;
}
.k-now-who { font-size: .78rem; color: var(--usu); letter-spacing: .1em; }
.k-now-rank {
  font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 2.6rem; color: var(--shu); letter-spacing: .12em; line-height: 1.3; margin-top: 4px;
}
.k-now-sub { font-size: .76rem; font-weight: 500; color: var(--sumi-2); line-height: 1.8; }

.k-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }   /* 2 x 2。札はどれも 数 / 級 / 名前 の 3 行でそろえる */
.k-stat small { display: block; font-size: .84rem; font-weight: 700; color: var(--sumi-2); margin-top: 2px; }
.k-stat.is-hayai b { color: var(--shu); }
.k-stat.is-nagai b { color: var(--ai); }
.k-stat {
  background: var(--kami-2); border: 1px solid var(--sen); border-radius: 12px;
  padding: 12px 6px 10px; text-align: center;
}
.k-stat b { display: block; font-size: 1.5rem; line-height: 1.2; color: var(--sumi); font-variant-numeric: tabular-nums; }
.k-stat span { display: block; font-size: .72rem; font-weight: 500; color: var(--usu); margin-top: 2px; }

  background: var(--kami-2); border: 1px solid var(--sen); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 10px 8px 6px; position: relative;
}

.k-where { display: block; font-size: .7rem; font-weight: 500; color: var(--usu); margin-top: 2px; }
.k-memo { display: block; font-size: .74rem; font-weight: 500; color: var(--sumi-2); line-height: 1.7; margin-top: 3px; }

.k-empty {
  background: var(--kami-2); border: 1px dashed var(--sen-2); border-radius: var(--radius);
  padding: 16px; font-size: .8rem; font-weight: 500; line-height: 1.9; color: var(--sumi-2);
}
.k-empty code { font-size: .74rem; background: var(--kami-3); padding: 1px 4px; border-radius: 4px; }
</style>

<script>
/*!
 * ひなの歴史 (級の記録)。中身は下の KIROKU に書く (このファイルだけ直せばよい)。
 *
 * 1 行 = 1 回の昇級・昇段 (いちばん最初の「はじめて級をもらった」も 1 行)。
 *   date  … 'YYYY-MM-DD'。日がわからなければ 'YYYY-MM' でもよい
 *   rank  … '15級' / '1級' / '初段' / '二段' など。数字は半角でも漢数字でもよい
 *   where … どこでの級か (道場の名前、将棋連盟、ネット将棋 など)。
 *           ちがう where は、グラフで別の線になる (級のつけ方が場所ごとにちがうため)
 *   memo  … ひとこと (なくてもよい)
 */
const KIROKU = {
  title: 'ひなの歴史',  // ページの見出し。空なら「級の記録」
  // 学年。この年度 (4月〜3月) に何年生か。ここから前の学年を数える
  gakunen: { nendo: 2026, nen: 4 },
  // 大会・タイトル戦など、級とは別の大きなできごと。グラフに金の駒の印で出る
  //   date … 'YYYY-MM-DD'   name … 大会の名前   koma … 駒に書く 1 文字   kekka … ひとこと
  //   jun: 1 / 2 / 3 … 優勝・準優勝・3位。どれも駒のかわりに 🏆 を出す
  //   (jun の無い大会は、その学年の色の小旗。koma を書いた大会 (香成戦) だけは金の駒)
  dekigoto: [
    { date: '2024-09-29', name: '赤旗 C級', kekka: '3位', jun: 3 },
    { date: '2024-11-02', name: 'テーブルマーク東海', kekka: '出場' },
    { date: '2024-11-03', name: '四日市一番街 D級', kekka: '3位', jun: 3 },
    { date: '2024-12-08', name: '将棋連盟100周年大会', kekka: '出場' },
    { date: '2024-12-28', name: 'いせ冬休み C2級', kekka: '準優勝', jun: 2 },
    { date: '2025-02-08', name: 'ちゅうでんこども将棋大会', kekka: '出場' },
    { date: '2025-11-03', name: '四日市一番街 C級', kekka: '3位', jun: 3 },
    { date: '2026-01-18', name: '香成戦', koma: '香', kekka: 'タイトル戦に出場' },  // 令和8年1月18日 (3年生)
    { date: '2026-06-13', name: '将棋フェス 中級者', kekka: '優勝', jun: 1 },  // 令和8年6月13日 (4年生)
  ],
  rows: [
    // { date: '2024-04-14', rank: '15級', where: '〇〇将棋教室', memo: 'はじめての級' },
    { date: '2024-09-29', rank: '17級' },  // 令和6年9月29日
    { date: '2024-11-10', rank: '16級' },  // 令和6年11月10日
    { date: '2024-12-26', rank: '15級' },  // 令和6年12月26日
    { date: '2024-12-29', rank: '14級' },  // 令和6年12月29日
    { date: '2025-01-25', rank: '13級' },  // 令和7年1月25日
    { date: '2025-05-25', rank: '12級' },  // 令和7年5月25日
    { date: '2025-06-22', rank: '11級' },  // 令和7年6月22日
    { date: '2025-06-30', rank: '10級' },  // 令和7年6月30日
    { date: '2025-10-26', rank: '9級' },  // 令和7年10月26日
    { date: '2025-10-31', rank: '8級' },  // 令和7年10月31日
    { date: '2026-02-26', rank: '7級' },  // 令和8年2月26日
    { date: '2026-05-26', rank: '6級' },  // 令和8年5月26日
    { date: '2026-07-12', rank: '5級' },  // 令和8年7月12日
    { date: '2026-09-25', rank: '4級' },  // 令和8年9月25日
    { date: '2026-10-18', rank: '3級' },  // 令和8年10月18日
    { date: '2026-11-15', rank: '2級' },  // 令和8年11月15日
  ]
};

(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  const KANSUJI = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10, 初: 1 };
  /** '15級' → -15、'初段' → 1、'二段' → 2。上にいくほど大きい数になる。 */
  function rankValue(rank) {
    const m = /^(\d+|[一二三四五六七八九十初]+)\s*(級|段)$/.exec(String(rank).trim());
    if (!m) throw new Error('級・段の書き方がちがう: ' + rank);
    let n;
    if (/^\d+$/.test(m[1])) n = Number(m[1]);
    else n = m[1] === '十' ? 10 : m[1].split('').reduce((a, c) => (c === '十' ? (a || 1) * 10 : a + KANSUJI[c]), 0);
    return m[2] === '級' ? -n : n;
  }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/.exec(s);
    if (!m) throw new Error('日付の書き方がちがう: ' + s);
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3] || 1));
  }
  function dateText(r) {
    const d = r.d;
    return (d.getMonth() + 1) + '月' + (r.date.split('-').length > 2 ? d.getDate() + '日' : '');
  }
  const DAY = 24 * 3600 * 1000;
  function span(days) {
    if (days < 60) return days + '日';
    const mo = Math.round(days / 30.44);
    return mo < 12 ? mo + 'か月' : Math.floor(mo / 12) + '年' + (mo % 12 ? (mo % 12) + 'か月' : '');
  }


  // 学年の色 [うすい地, こい線]。学年ごとの帯と、グラフの線・丸を同じ系統の色にする
  const GAKU_IRO = { 1: ['#fbeef2', '#b4506f'], 2: ['#f7ece7', '#b23a2e'], 3: ['#e9eef5', '#2f5d8a'],
                     4: ['#eaf2e4', '#3f7a3a'], 5: ['#efe9f5', '#5b4370'], 6: ['#fbf3dc', '#8a6a10'] };
  function gakuNen(nd) { return KIROKU.gakunen ? KIROKU.gakunen.nen + (nd - KIROKU.gakunen.nendo) : 0; }
  function gakuIro(t) { return GAKU_IRO[gakuNen(nendoOf(new Date(t)))] || ['#f2ece0', '#b23a2e']; }
  /** t0 から t1 のあいだにある、学年の切りかわり (4月1日) */
  function sakaime(t0, t1) {
    const out = [];
    for (let nd = nendoOf(new Date(t0)) + 1; nd <= nendoOf(new Date(t1)); nd++) out.push(new Date(nd, 3, 1).getTime());
    return out;
  }
  /** t0 から t1 までの横線を、学年の切りかわりで分けて、それぞれの学年の色で引く */
  function yokoSen(svg, mk, xOf, yy, t0, t1, cls) {
    const cuts = [t0].concat(sakaime(t0, t1).filter((t) => t > t0 && t < t1), [t1]);
    for (let i = 0; i + 1 < cuts.length; i++) {
      svg.appendChild(mk('line', { x1: xOf(cuts[i]), x2: xOf(cuts[i + 1]), y1: yy, y2: yy,
        class: cls, stroke: gakuIro(cuts[i])[1] }));
    }
  }

  function render() {
    const body = $('kyu-body');
    body.innerHTML = '';
    if (KIROKU.title) {
      $('k-title').firstChild.textContent = KIROKU.title;
      document.title = KIROKU.title + ' - ひな将棋';
    }

    const rows = KIROKU.rows.map((r) => Object.assign({}, r, { d: parseDate(r.date), v: rankValue(r.rank), where: r.where || '' }))
      .sort((a, b) => a.d - b.d);

    if (!rows.length) {
      const e = el('div', 'k-empty');
      e.innerHTML = 'まだ記録がありません。<br><code>hina.html</code> の <code>KIROKU</code> に、'
        + '昇級した日・級・場所を 1 行ずつ書くと、ここに年表とグラフが出ます。';
      body.appendChild(e);
      return;
    }

    // days … 1 つ前の級から何日であがったか (札の「スピード昇級」に使う)
    // stay … その級に何日いたか (在籍日数)。つぎの級にあがった日 − その級になった日。
    //        いまの級は、今日までの日数 (まだ途中)
    const last = {};
    const kyou = new Date();
    kyou.setHours(0, 0, 0, 0);
    for (const r of rows) {
      const p = last[r.where];
      r.days = p ? Math.round((r.d - p.d) / DAY) : null;
      if (p) p.stay = r.days;
      r.stay = Math.max(0, Math.round((kyou - r.d) / DAY));
      r.ima = true;
      if (p) p.ima = false;
      last[r.where] = r;
    }

    // いまの級 (いちばん新しい記録)
    const now = rows[rows.length - 1];
    const first = rows[0];
    const card = el('div', 'k-now');
    card.appendChild(el('div', 'k-now-who', 'いま'));
    card.appendChild(el('div', 'k-now-rank', now.rank));
    card.appendChild(el('div', 'k-now-sub',
      now.d.getFullYear() + '年' + dateText(now) + 'に昇級' + (now.where ? '（' + now.where + '）' : '')));
    // つぎの級と、これまでの平均と比べて何日目か (めやす)
    const sotsu = rows.filter((r) => !r.ima);
    if (sotsu.length) {
      const heikin = Math.round(sotsu.reduce((a, r) => a + r.stay, 0) / sotsu.length);
      const goal = el('div', 'k-goal');
      const g1 = el('div', 'k-goal-t');
      g1.appendChild(document.createTextNode('つぎは '));
      g1.appendChild(el('b', null, rankName(now.v === -1 ? 1 : now.v + 1)));
      goal.appendChild(g1);
      const bar = el('div', 'k-goal-bar');
      const fill = el('i');
      fill.style.width = Math.min(100, Math.max(3, now.stay / heikin * 100)) + '%';
      bar.appendChild(fill);
      goal.appendChild(bar);
      goal.appendChild(el('div', 'k-goal-n', 'いま ' + now.stay + '日目　／　これまでの平均 ' + heikin + '日'));
      card.appendChild(goal);
    }
    body.appendChild(card);

    const ups = rows.filter((r) => r.days !== null);
    const owatta = rows.filter((r) => !r.ima);      // もう卒業した級 (在籍日数が決まっている)
    const stats = el('div', 'k-stats');
    stats.style.marginTop = '11px';
    const stat = (n, label, cls, sub) => {
      const s = el('div', 'k-stat' + (cls ? ' ' + cls : ''));
      s.appendChild(el('b', null, n));
      if (sub) s.appendChild(el('small', null, sub));
      s.appendChild(el('span', null, label));
      stats.appendChild(s);
    };
    // 2 x 2 の札。どれも「数 / 級 / 何の数か」の 3 行
    stat(span(Math.round((now.d - first.d) / DAY)), 'はじめてから', '', first.rank + ' → ' + now.rank);
    stat(owatta.length ? Math.round(owatta.reduce((a, r) => a + r.stay, 0) / owatta.length) + '日' : '—', '1つの級にいた日数', '', '平均');
    if (owatta.length) {
      // いまの級はまだ途中なので入れない。同じ日数の級が2つ以上あれば、ならべて出す
      const hayai = Math.min.apply(null, owatta.map((r) => r.stay));
      const nagai = Math.max.apply(null, owatta.map((r) => r.stay));
      const kyuOf = (d) => owatta.filter((r) => r.stay === d).map((r) => r.rank).join('・');
      stat(hayai + '日', 'いちばん短かった級', 'is-hayai', kyuOf(hayai));
      stat(nagai + '日', 'いちばん長かった級', 'is-nagai', kyuOf(nagai));
    }
    body.appendChild(stats);

    body.appendChild(el('div', 'zukan-fam', 'あがってきた道'));
    body.appendChild(zentai(rows));

    body.appendChild(el('div', 'zukan-fam', '学年ごとの歩み'));
    body.appendChild(nenpyo(rows));

    // 大会・タイトル戦
    const ev = (KIROKU.dekigoto || []).map((e) => Object.assign({}, e, { d: parseDate(e.date) })).sort((a, b) => a.d - b.d);
    if (ev.length) {
      body.appendChild(el('div', 'zukan-fam', '大会・タイトル戦'));
      const ul = el('ul', 'k-ev');
      for (const e of ev) {
        const li = el('li', e.jun === 1 ? 'is-yusho' : e.jun ? 'is-nyusho' : '');
        if (medalOf(e)) li.appendChild(el('span', 'k-cup', medalOf(e)));
        else if (komaOf(e)) li.appendChild(el('span', 'k-koma', komaOf(e)));
        else {
          const h = el('span', 'k-hata');
          h.style.setProperty('--hi', gakuIro(e.d.getTime())[1]);
          li.appendChild(h);
        }
        const b = el('span', 'k-ev-b');
        b.appendChild(el('b', null, e.name));
        b.appendChild(el('span', null, e.d.getFullYear() + '年' + (e.d.getMonth() + 1) + '月' + e.d.getDate() + '日　'
          + nenOf(nendoOf(e.d)) + (e.kekka ? '　' + e.kekka : '')));
        li.appendChild(b);
        ul.appendChild(li);
      }
      body.appendChild(ul);
    }
  }

  /**
   * あがってきた道 (ぜんたい図)。はじめから今日までを、すべらせずに 1 枚で見る。
   * 横が日付、たてが級。うしろに学年の帯、線と丸は学年の色。大会は金の駒の小さな印。
   * ● をおすと、日付と級が出る。
   */
  function zentai(rows) {
    const W = 360, H = 300, L = 38, R = 14, T = 26, B = 24;
    const t0 = rows[0].d.getTime();
    const t1 = Math.max(rows[rows.length - 1].d.getTime(), Date.now());
    const step = (v) => (v > 0 ? v - 1 : v);          // 1級 と 初段 をとなりにする
    const vs = rows.map((r) => step(r.v));
    const lo = Math.min.apply(null, vs) - 0.5, hi = Math.max.apply(null, vs) + 1.5;   // 上に「つぎの級」の段
    const x = (t) => L + (W - L - R) * (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0));
    const y = (v) => T + (H - T - B) * (1 - (step(v) - lo) / (hi - lo));
    const NS = 'http://www.w3.org/2000/svg';
    const s = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };

    const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'k-chart', role: 'img',
      'aria-label': 'はじめから今日までの級のうつりかわり' });

    // 学年の帯と名前
    if (KIROKU.gakunen) {
      for (let nd = nendoOf(new Date(t0)); nd <= nendoOf(new Date(t1)); nd++) {
        const a = Math.max(t0, new Date(nd, 3, 1).getTime());
        const b = Math.min(t1, new Date(nd + 1, 3, 1).getTime());
        if (b <= a) continue;
        const g = gakuNen(nd);
        const iro = GAKU_IRO[g] || ['#f2ece0', '#8a8072'];
        svg.appendChild(s('rect', { x: x(a), y: 2, width: Math.max(0, x(b) - x(a)), height: H - B - 2, fill: iro[0] }));
        if (x(b) - x(a) > 26) {
          svg.appendChild(s('text', { x: (x(a) + x(b)) / 2, y: 16, 'text-anchor': 'middle', class: 'ax-g', fill: iro[1] },
            g >= 1 && g <= 6 ? g + '年生' : nd + '年度'));
        }
      }
    }

    // たての目盛り (3 級ごと。いまの級とつぎの級は必ず出す)
    const ima = Math.max.apply(null, vs);
    const imaIro = gakuIro(rows[rows.length - 1].d.getTime())[1];
    for (let k = Math.ceil(lo); k <= Math.floor(hi); k++) {
      const v = k >= 0 ? k + 1 : k;
      const sono = k === ima, tsugi = k === ima + 1;
      if (!sono && !tsugi && (ima - k) % 3) continue;
      const yy = y(v);
      svg.appendChild(s('line', { x1: L, x2: W - R, y1: yy, y2: yy, class: 'grid' + (tsugi ? ' is-tsugi' : '') }));
      const t = s('text', { x: L - 5, y: yy + 3.5, 'text-anchor': 'end', class: 'ax' + (sono ? ' is-ima' : '') }, rankName(v));
      if (sono || tsugi) t.setAttribute('fill', imaIro);
      svg.appendChild(t);
    }
    // 横の目盛り = 年のはじめ
    for (let yr = new Date(t0).getFullYear() + 1; yr <= new Date(t1).getFullYear(); yr++) {
      const t = new Date(yr, 0, 1).getTime();
      svg.appendChild(s('text', { x: x(t), y: H - 7, 'text-anchor': 'middle', class: 'ax' }, String(yr)));
    }

    // 階段の線。学年をまたぐ横線は 4月1日で色を変える
    rows.forEach((r, j) => {
      const t = r.d.getTime();
      if (j) svg.appendChild(s('line', { x1: x(t), x2: x(t), y1: y(rows[j - 1].v), y2: y(r.v), class: 'ln', stroke: gakuIro(t)[1] }));
      yokoSen(svg, s, x, y(r.v), t, j + 1 < rows.length ? rows[j + 1].d.getTime() : t1, 'ln');
    });

    // 大会・タイトル戦の印 (小さな金の駒・メダル)。近い日の印は 1 段ずつ上にずらす
    const evs = (KIROKU.dekigoto || []).filter((e) => rows.some((r) => r.d.getTime() <= parseDate(e.date).getTime()));
    // ほかの印や、階段の ● にかからない高さまで上げる
    const tsubu = rows.map((r) => [x(r.d.getTime()), y(r.v)]);
    const okiba = [];
    for (const e of evs.slice().sort((p, q) => parseDate(p.date) - parseDate(q.date))) {
      const t = parseDate(e.date).getTime();
      let at = null;
      for (const r of rows) if (r.d.getTime() <= t) at = r;
      const kw = 13, kh = 16, kx = x(t);
      let ky = y(at.v) - 22;
      const butsukaru = (yy) => okiba.some((p) => Math.abs(p[0] - kx) < kw + 1 && Math.abs(p[1] - yy) < kh + 1)
        || tsubu.some((p) => Math.abs(p[0] - kx) < kw / 2 + 6 && p[1] > yy - 6 && p[1] < yy + kh + 6);
      for (let g = 0; g < 30 && butsukaru(ky); g++) ky -= 6;
      okiba.push([kx, ky]);
      if (ky + kh + 1 < y(at.v) - 4) svg.appendChild(s('line', { x1: kx, x2: kx, y1: ky + kh + 1, y2: y(at.v) - 4, class: 'ev-pole' }));
      if (medalOf(e)) { svg.appendChild(s('text', { x: kx, y: ky + kh, 'text-anchor': 'middle', class: 'ev-cup' }, medalOf(e))); continue; }
      if (!komaOf(e)) { svg.appendChild(hata(s, kx, ky, kh, gakuIro(t)[1])); continue; }
      svg.appendChild(s('path', { class: 'ev-koma',
        d: 'M' + kx + ' ' + ky + ' L' + (kx + kw * 0.38) + ' ' + (ky + kh * 0.2) + ' L' + (kx + kw / 2) + ' ' + (ky + kh)
          + ' L' + (kx - kw / 2) + ' ' + (ky + kh) + ' L' + (kx - kw * 0.38) + ' ' + (ky + kh * 0.2) + ' Z' }));
      svg.appendChild(s('text', { x: kx, y: ky + kh - 3.5, 'text-anchor': 'middle', class: 'ev-moji' }, komaOf(e)));
    }

    const wrap = el('div', 'k-chart-wrap');
    const tip = el('div', 'k-tip');
    tip.hidden = true;
    rows.forEach((r) => {
      const cx = x(r.d.getTime()), cy = y(r.v);
      const c = gakuIro(r.d.getTime())[1];
      svg.appendChild(s('circle', { cx: cx, cy: cy, r: r.ima ? 5 : 3.6, class: 'dot', fill: r.ima ? c : '#fff', stroke: c }));
      const hit = s('circle', { cx: cx, cy: cy, r: 12, class: 'hit', tabindex: 0 });
      const show = () => {
        tip.hidden = false;
        tip.textContent = r.d.getFullYear() + '年' + dateText(r) + '　' + r.rank;
        tip.style.left = (cx / W * 100) + '%';
        tip.style.top = (cy / H * 100) + '%';
      };
      hit.addEventListener('pointerenter', show);
      hit.addEventListener('focus', show);
      hit.addEventListener('click', show);
      hit.addEventListener('pointerleave', () => { tip.hidden = true; });
      hit.addEventListener('blur', () => { tip.hidden = true; });
      svg.appendChild(hit);
    });
    // いまの級の名前
    const last = rows[rows.length - 1];
    const lab = s('text', { x: x(last.d.getTime()) - 8, y: y(last.v) - 8, 'text-anchor': 'end', class: 'ima-t', fill: imaIro }, 'いま ' + last.rank);
    svg.appendChild(lab);

    wrap.appendChild(svg);
    wrap.appendChild(tip);
    return wrap;
  }

  /** 大会の印。入賞 (優勝・準優勝・3位) は 🏆、koma のある大会は金の駒、ほかは小旗 */
  function medalOf(e) { return e.jun >= 1 && e.jun <= 3 ? '🏆' : null; }
  function komaOf(e) { return e.koma; }
  /** 小旗 (出場した大会)。x, y は旗のいちばん上、h は高さ。旗の色はその日の学年の色 */
  function hata(mk, x, y, h, iro) {
    const g = mk('g', { class: 'hata' });
    g.appendChild(mk('line', { x1: x - h * 0.28, x2: x - h * 0.28, y1: y, y2: y + h, stroke: '#8a7550', 'stroke-width': Math.max(1, h / 14), 'stroke-linecap': 'round' }));
    g.appendChild(mk('path', { d: 'M' + (x - h * 0.28) + ' ' + y + ' L' + (x + h * 0.42) + ' ' + (y + h * 0.24) + ' L' + (x - h * 0.28) + ' ' + (y + h * 0.5) + ' Z',
      fill: iro, stroke: 'rgba(0,0,0,.15)', 'stroke-width': 0.6, 'stroke-linejoin': 'round' }));
    return g;
  }

  /**
   * 印を重ねないための段。左から順に、前の印とぶつかるなら 1 段上にあげる。
   * wOf(e) はその印 (と字) の横はば。返すのは e → 段 (0, 1, 2 …)
   */
  function dan(list, xOf, wOf) {
    const placed = [];
    const out = new Map();
    for (const e of list.slice().sort((a, b) => xOf(a) - xOf(b))) {
      const x = xOf(e), w = wOf(e);
      let lv = 0;
      while (placed.some((p) => p.lv === lv && Math.abs(p.x - x) < (p.w + w) / 2)) lv++;
      placed.push({ x: x, w: w, lv: lv });
      out.set(e, lv);
    }
    return out;
  }

  function rankName(v) {
    const K = ['', '初', '二', '三', '四', '五', '六', '七', '八', '九'];
    return v < 0 ? (-v) + '級' : (K[v] || v) + '段';
  }

  /** 年度。4月から次の3月までを 1 年と数える (学校と同じ) */
  function nendoOf(d) { return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
  const NEN = ['', '1年生', '2年生', '3年生', '4年生', '5年生', '6年生'];
  function nenOf(nendo) {
    const g = KIROKU.gakunen;
    const n = g ? g.nen + (nendo - g.nendo) : null;
    if (n === null) return nendo + '年度';
    if (n >= 1 && n <= 6) return NEN[n];
    if (n >= 7 && n <= 9) return '中学' + (n - 6) + '年生';
    if (n >= 10 && n <= 12) return '高校' + (n - 9) + '年生';
    return n <= 0 ? '小学校に入る前' : nendo + '年度';
  }

  /**
   * 学年ごとの歩み。級の階段のグラフを、横にすべらせて見る。
   * 左が古く、右が新しい。● が昇級した日、横の線がその級にいた日数。
   * 横の長さは日数に比べる (BASE + 日数 x PX_DAY。3日なら短く、120日なら長い)。
   * 字は、階段が右上へのぼるので空いている所に置く: 級の名前と札は ● の左上、日付は右下、日数は線の上
   * うしろに学年ごとの色の帯を敷き、帯の上に学年の名前とその学年の「7級 → 2級・5回」を出す。
   */
  // (場所 where がちがう記録が混ざると、1 本の道にならべてしまう。いまの記録は場所が 1 つだけ)
  function nenpyo(rows) {
    const BASE = 20;            // どの級にもある横の長さ (● どうしがくっつかないように)
    const PX_DAY = 1.5;         // 1 日ぶんの横の長さ
    const segW = (r) => BASE + r.stay * PX_DAY;
    const ROW_H = 26;           // 1 級ぶんの高さ。1 段ずつ上がっていくのが見えるように大きめ
    const AXIS = 42;            // 左の目盛り (すべらせても動かない) のはば
    const PAD_L = AXIS + 130, PAD_R = 150, TOP = 84, BOTTOM = 72;
    const NS = 'http://www.w3.org/2000/svg';
    const s = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };

    const step = (v) => (v > 0 ? v - 1 : v);          // 1級 と 初段 をとなりにする
    const lo = Math.min.apply(null, rows.map((r) => step(r.v)));
    const ima = Math.max.apply(null, rows.map((r) => step(r.v)));
    const hi = ima + 1;            // いちばん上は、つぎにめざす級 (目標の段)
    const H = TOP + (hi - lo) * ROW_H + BOTTOM;
    const y = (r) => TOP + (hi - step(r.v)) * ROW_H;

    // それぞれの級の左はし (昇級した日) の x
    const xs = [];
    let x = PAD_L;
    for (const r of rows) { xs.push(x); x += segW(r); }
    const W = x + PAD_R;
    // ある日が、横のどこにあたるか (その日をふくむ級の中で、日数の割合で決める)
    function xOfDate(t) {
      for (let i = rows.length - 1; i >= 0; i--) {
        if (t >= rows[i].d.getTime()) {
          const w = segW(rows[i]);
          const f = rows[i].stay ? Math.min(1, (t - rows[i].d.getTime()) / DAY / rows[i].stay) : 0;
          return xs[i] + w * f;
        }
      }
      return PAD_L;
    }

    const svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, class: 'michi', role: 'img',
      'aria-label': '級のうつりかわり。左が古く、右が新しい。横にすべらせて見てね' });
    // 金の駒のぬり (大会・タイトル戦の印)
    const defs = s('defs');
    const kin = s('linearGradient', { id: 'kin', x1: 0, y1: 0, x2: 0, y2: 1 });
    kin.appendChild(s('stop', { offset: '0', 'stop-color': '#f6e4a8' }));
    kin.appendChild(s('stop', { offset: '1', 'stop-color': '#c9a65a' }));
    defs.appendChild(kin);
    svg.appendChild(defs);

    // 学年の帯
    const GIRO = GAKU_IRO;
    const nd0 = nendoOf(rows[0].d), nd1 = nendoOf(new Date());
    for (let nd = nd0; nd <= nd1; nd++) {
      const these = rows.filter((r) => nendoOf(r.d) === nd);
      const a = nd === nd0 ? 0 : xOfDate(new Date(nd, 3, 1).getTime());
      const b = nd === nd1 ? W : xOfDate(new Date(nd + 1, 3, 1).getTime());
      const g = KIROKU.gakunen ? KIROKU.gakunen.nen + (nd - KIROKU.gakunen.nendo) : 0;
      const iro = GIRO[g] || ['#f2ece0', '#8a8072'];
      svg.appendChild(s('rect', { x: a, y: 0, width: Math.max(0, b - a), height: H, fill: iro[0] }));
      svg.appendChild(s('line', { x1: a, x2: a, y1: 0, y2: H, class: 'mi-sakai', stroke: iro[1] }));
      const lx = Math.max(a, AXIS) + 12;     // 左の目盛りの下にもぐらないように
      svg.appendChild(s('text', { x: lx, y: 26, class: 'mi-nen', fill: iro[1] }, nenOf(nd)));
      const before = rows.filter((r) => nendoOf(r.d) < nd);
      const start = before.length ? before[before.length - 1].rank : (these[0] ? these[0].rank : '');
      const end = these.length ? these[these.length - 1].rank : start;
      const n = these.filter((r) => r.days !== null).length;
      svg.appendChild(s('text', { x: lx, y: 44, class: 'mi-sum' },
        nd + '年度　' + (start === end ? end : start + ' → ' + end) + (n ? '・' + n + '回 昇級' : '')));
    }

    // うすい横線 (目盛り)。1 級ごと
    for (let k = lo; k <= hi; k++) {
      const yy = TOP + (hi - k) * ROW_H;
      svg.appendChild(s('line', { x1: 0, x2: W, y1: yy, y2: yy, class: 'mi-grid' }));
    }

    // 大会・タイトル戦の印。その日にいた級の線の上に、金の駒 (入賞はメダル) を立て、上に名前と日付を積む。
    // 置く高さは、その字の横はばの中にある階段 (級の名前・札・日数の字) よりも上。
    // 近い日の大会どうしもぶつからないよう、上へずらし、線まで点線でつなぐ
    const evs = (KIROKU.dekigoto || []).filter((e) => rows.some((r) => r.d.getTime() <= parseDate(e.date).getTime()))
      .sort((p, q) => parseDate(p.date) - parseDate(q.date));
    const nameW = (e) => Math.max(e.name.length * 13.5, 40) + 12;
    const evX = (e) => Math.max(xOfDate(parseDate(e.date).getTime()), AXIS + nameW(e) / 2 + 4);
    // 階段の字がある所: 級ごとに [左, 右, 上]
    const kaidan = rows.map((r, i) => [xs[i] - 120, xs[i] + segW(r) + (r.ima ? 40 : 0), y(r) - 32]);
    const placedEv = [];
    const kh = 30, kw = 24;
    for (const e of evs) {
      const t = parseDate(e.date).getTime();
      let at = null;
      for (const r of rows) if (r.d.getTime() <= t) at = r;
      const mx = xOfDate(t), my = y(at);
      const tx = evX(e), w = nameW(e);
      const xa = Math.min(tx - w / 2, mx - 16), xb = Math.max(tx + w / 2, mx + 16);
      let base = my - 24;
      for (const k of kaidan) if (k[0] < xb && k[1] > xa) base = Math.min(base, k[2]);
      let ky = base - kh - 2;
      // 前の大会の字とぶつかるなら、上へずらす
      for (let guard = 0; guard < 60; guard++) {
        const top = ky - 36, bottom = ky + kh;
        if (!placedEv.some((p) => p.xa < xb && p.xb > xa && p.top < bottom + 4 && p.bottom > top - 4)) break;
        ky -= 8;
      }
      placedEv.push({ xa: xa, xb: xb, top: ky - 36, bottom: ky + kh });
      const g = s('g', { class: 'mi-ev' });
      const kx = mx;
      if (ky + kh + 2 < my - 19) g.appendChild(s('line', { x1: mx, x2: mx, y1: ky + kh + 2, y2: my - 19, class: 'mi-ev-pole' }));
      if (medalOf(e)) {
        g.appendChild(s('text', { x: kx, y: ky + kh - 2, 'text-anchor': 'middle', class: 'mi-ev-cup' }, medalOf(e)));
      } else if (!komaOf(e)) {
        g.appendChild(hata(s, kx, ky + 2, kh - 2, gakuIro(t)[1]));
      } else {
        // 将棋の駒の形 (五角形)
        g.appendChild(s('path', { class: 'mi-ev-koma',
          d: 'M' + kx + ' ' + ky + ' L' + (kx + kw * 0.38) + ' ' + (ky + kh * 0.2) + ' L' + (kx + kw / 2) + ' ' + (ky + kh)
            + ' L' + (kx - kw / 2) + ' ' + (ky + kh) + ' L' + (kx - kw * 0.38) + ' ' + (ky + kh * 0.2) + ' Z' }));
        g.appendChild(s('text', { x: kx, y: ky + kh - 7, 'text-anchor': 'middle', class: 'mi-ev-moji' }, komaOf(e)));
      }
      // 字は印の上に、大会の名前 → 日付 の順で積む (横に置くと、どの印の日付か分かりにくい)
      g.appendChild(s('text', { x: tx, y: ky - 21, 'text-anchor': 'middle', class: 'mi-ev-name' }, e.name));
      g.appendChild(s('text', { x: tx, y: ky - 6, 'text-anchor': 'middle', class: 'mi-ev-kekka' },
        (parseDate(e.date).getMonth() + 1) + '/' + parseDate(e.date).getDate()));
      svg.appendChild(g);
    }

    // いちばん短かった級・長かった級 (上の札と同じ)。いまの級はまだ途中なので入れない
    const sotsu = rows.filter((r) => !r.ima);
    const mijikai = sotsu.length ? Math.min.apply(null, sotsu.map((r) => r.stay)) : null;
    const nagai = sotsu.length ? Math.max.apply(null, sotsu.map((r) => r.stay)) : null;
    const BAI = { 2: 'ダブル昇級', 3: 'トリプル昇級' };

    // 道の線 (階段)。線も丸も、その日の学年の色。いまの級だけ点線
    rows.forEach((r, i) => {
      const t = r.d.getTime();
      if (i) svg.appendChild(s('line', { x1: xs[i], x2: xs[i], y1: y(rows[i - 1]), y2: y(r), class: 'mi-line', stroke: gakuIro(t)[1] }));
      if (!r.ima) yokoSen(svg, s, xOfDate, y(r), t, rows[i + 1].d.getTime(), 'mi-line');
    });
    const last = rows[rows.length - 1];
    const lx = xs[rows.length - 1];
    // つぎの級の段。点線と「つぎは ○級」で、上にまだ段があることを見せる
    const ty = TOP;
    const tIro = gakuIro(last.d.getTime())[1];
    svg.appendChild(s('line', { x1: lx - 40, x2: W, y1: ty, y2: ty, class: 'mi-tsugi', stroke: tIro }));
    svg.appendChild(s('text', { x: lx + 14, y: ty - 7, class: 'mi-tsugi-t', fill: tIro },
      'つぎは ' + rankName(last.v === -1 ? 1 : last.v + 1)));
    svg.appendChild(s('path', { d: 'M' + lx + ' ' + y(last) + ' H' + (lx + segW(last) + 40),
      class: 'mi-line is-ima', stroke: gakuIro(last.d.getTime())[1] }));

    rows.forEach((r, i) => {
      const x0 = xs[i], yy = y(r);
      const w = segW(r);
      const g = s('g', { class: 'mi-step' + (r.ima ? ' is-ima' : '') });
      g.style.setProperty('--gi', gakuIro(r.d.getTime())[1]);   // この級の学年の色
      // 級の名前 (● の左上。階段は右上へのぼるので、ここはいつも空いている)
      const nameW = r.rank.length * 16;
      g.appendChild(s('text', { x: x0 - 10, y: yy - 8, 'text-anchor': 'end', class: 'mi-rank' }, r.rank));
      // 札: スタート / ダブル昇級 / スピード昇級 / いま (名前のさらに左)
      const kaime = rows.filter((q, j) => j <= i && q.where === r.where
        && q.d.getFullYear() === r.d.getFullYear() && q.d.getMonth() === r.d.getMonth()).length;
      let fuda = null;
      if (r.days === null) fuda = ['スタート', 'is-start'];
      else if (kaime >= 2) fuda = [BAI[kaime] || kaime + '回目の昇級', 'is-fast'];
      else if (r.days <= 14) fuda = ['スピード昇級', 'is-fast'];
      if (r.ima) fuda = ['いま', 'is-ima'];
      if (fuda) g.appendChild(pill(x0 - 10 - nameW - 6, yy - 22, fuda[0], fuda[1], true));
      // 日付 (● の右下)
      g.appendChild(s('text', { x: x0 + 8, y: yy + 18, class: 'mi-date' },
        (r.d.getMonth() + 1) + '/' + (r.date.split('-').length > 2 ? r.d.getDate() : '')));
      g.appendChild(s('text', { x: x0 + 8, y: yy + 31, class: 'mi-year' }, String(r.d.getFullYear())));
      // いちばん短い・長い (日付の下)
      if (!r.ima && r.stay === mijikai) g.appendChild(pill(x0 + 8, yy + 37, 'いちばん短い', 'is-hayai'));
      if (!r.ima && r.stay === nagai) g.appendChild(pill(x0 + 8, yy + 37, 'いちばん長い', 'is-nagai'));
      if (r.memo) g.appendChild(s('text', { x: x0 + 8, y: yy + 66, class: 'mi-memo' }, r.memo));   // ひとこと
      // その級にいた日数 (線の上、まん中)
      g.appendChild(s('text', { x: x0 + Math.max(w / 2, 24), y: yy - 6, 'text-anchor': 'middle', class: 'mi-stay' }, r.stay + '日'));
      // 昇級の ●
      g.appendChild(s('circle', { cx: x0, cy: yy, r: 7, class: 'mi-dot' }));
      svg.appendChild(g);
    });

    function pill(px, py, text, cls, right) {
      const wpx = text.length * 10.5 + 14;
      const g = s('g', { class: 'mi-pill ' + cls });
      const x0 = right ? px - wpx : px;
      g.appendChild(s('rect', { x: x0, y: py, width: wpx, height: 16, rx: 8 }));
      g.appendChild(s('text', { x: x0 + wpx / 2, y: py + 11.5, 'text-anchor': 'middle' }, text));
      return g;
    }

    const wrap = el('div', 'michi-wrap');
    wrap.id = 'ima';
    const box = el('div', 'michi-box');
    const sc = el('div', 'michi-scroll');
    sc.appendChild(svg);
    box.appendChild(sc);
    // 左の目盛り。すべらせても動かないよう、上に重ねる
    const ax = s('svg', { width: AXIS, height: H, class: 'michi-axis', 'aria-hidden': 'true' });
    const rankOf = (k) => { const v = k >= 0 ? k + 1 : k; return rankName(v); };
    const imaIro = gakuIro(rows[rows.length - 1].d.getTime())[1];
    for (let k = lo; k <= hi; k++) {
      const t = s('text', { x: AXIS - 6, y: TOP + (hi - k) * ROW_H + 3.5, 'text-anchor': 'end',
        class: 'mi-ax' + (k === ima ? ' is-ima' : k === hi ? ' is-tsugi' : '') }, rankOf(k));
      if (k === ima || k === hi) t.setAttribute('fill', imaIro);
      ax.appendChild(t);
    }
    box.appendChild(ax);
    wrap.appendChild(box);
    // はじめ・いま へ飛ぶボタン
    const nav = el('div', 'michi-nav');
    const b1 = el('button', 'michi-btn', '◀ はじめ');
    const b2 = el('button', 'michi-btn', 'いま ▶');
    b1.type = b2.type = 'button';
    b1.addEventListener('click', () => sc.scrollTo({ left: 0, behavior: 'smooth' }));
    // 「いま」は右はしではなく、いまの級の ● が画面のまん中より少し右に来るところ (手前の段も見える)
    const imaLeft = () => Math.max(0, xs[rows.length - 1] - sc.clientWidth * 0.6);
    b2.addEventListener('click', () => sc.scrollTo({ left: imaLeft(), behavior: 'smooth' }));
    nav.append(b1, el('span', 'michi-hint', '← 横にすべらせて見てね →'), b2);
    wrap.appendChild(nav);
    // さいしょは、いまの級が見えるところから
    requestAnimationFrame(() => { sc.scrollLeft = imaLeft(); });
    wrap.imaLeft = imaLeft;
    return wrap;
  }


  render();
  window.__kyu = { rankValue: rankValue, render: render };
})();
</script>
</body>
