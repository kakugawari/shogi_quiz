<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひな将棋</title>
<meta name="description" content="ひなの将棋の記録。級の歴史、リーグ戦の勝率チェック、タイトル年表">
<meta name="theme-color" content="#141a3a">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ひな将棋">
<!-- ホーム画面に追加して開いたとき、時計や電池の帯の下まで画面を描く (app_template と同じ)。
     無いと iOS は帯の下からページを始め、帯を theme-color の板で塗る。
     上の安全域は site.css の env(safe-area-inset-top) で空けてある。
     iOS は追加したときの設定を覚えているので、前に追加したアイコンは作り直さないと変わらない -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   タイトル画面。アイコンと同じ紺の盤と駒の絵を地にして、
   白い筆文字の「ひな将棋」と、教室の料金表をのせる。
   =========================================================== */
:root {
  --kon: #141a3a;          /* 地の紺 (アイコンと同じ) */
  --kon-2: #1d2552;
  --kin: #c9a65a;          /* 金のふち */
  --kin-hi: #e6cc8c;
  --kami: #fbf8f0;         /* 料金表の紙 */
  --sumi: #22284a;         /* 料金表の字 (紺がかった墨) */
  --usu: #8a8072;
  --shu: #c4553e;          /* 「料金」の判 */
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--kon); }
/* 時計や電池の帯の下に、地と同じ色の板を置く。下へすべらせた中身が時計と重ならないように */
body::before {
  content: ""; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top);
  background: var(--kon); z-index: 10; pointer-events: none;
}
body {
  min-height: 100dvh; color: #f4efe2;
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  font-weight: 700;
  background: radial-gradient(120% 70% at 50% 0, var(--kon-2), var(--kon) 70%) fixed, var(--kon);
  display: flex; justify-content: center; position: relative;
}
.e {                       /* 盤と駒の絵。ふちを紺にぼかして、地になじませる */
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: min(100%, 620px); aspect-ratio: 620 / 676;
  background: url(./title-bg.jpg) center / cover no-repeat;
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 98%), linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(180deg, #000 55%, transparent 98%), linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
          mask-composite: intersect;
  pointer-events: none;
}
.waku {                    /* 金のふち。アイコンと同じ角丸の額。中身といっしょにのびる */
  position: relative; width: calc(100% - 16px); max-width: 560px;
  min-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  margin: max(8px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom));
  padding: 10px 12px 18px;
  border: 2px solid rgba(201, 166, 90, .85); border-radius: 28px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 1px rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; align-items: center;
}

/* ---------------- ロゴ ---------------- */
.logo { margin-top: 12vh; width: min(82%, 380px); text-align: center; animation: fude .9s cubic-bezier(.2, .8, .3, 1) both; }
.logo img { display: block; width: 100%; height: auto; }
@keyframes fude { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------------- Enter ---------------- */
/* ボタンは 1 つだけ。小さく、金のふちで、ゆっくり光る */
.enter {
  margin: 7vh 0 28px; display: inline-block; text-decoration: none;
  font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem;
  letter-spacing: .3em; text-indent: .3em; color: var(--kin-hi);
  padding: 10px 30px; border: 1px solid var(--kin); border-radius: 999px;
  background: rgba(16, 21, 50, .6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  animation: rise .6s .3s both, hikari 2.8s 1s ease-in-out infinite;
}
.enter:active { transform: translateY(1px); }
@keyframes hikari {
  0%, 100% { box-shadow: 0 0 0 0 rgba(230, 204, 140, 0); }
  50% { box-shadow: 0 0 18px 2px rgba(230, 204, 140, .35); }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------------- 料金表 ---------------- */
.ryoukin {
  width: 100%; margin-top: auto; color: var(--sumi);
  background: var(--kami); border: 2px solid #2b3768; border-radius: 12px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .4);
  background-image: repeating-linear-gradient(90deg, rgba(150, 130, 95, .05) 0 1px, transparent 1px 6px);
  animation: rise .6s .4s both;
}
.ry-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 12px; border-bottom: 1px solid #cfd2dc; }
.ry-han {
  width: 34px; height: 34px; border-radius: 7px; flex: none; display: grid; place-items: center;
  background: var(--shu); color: #fff; font-family: "Shippori Mincho B1", serif; font-size: .7rem; line-height: 1;
  box-shadow: 0 2px 4px rgba(120, 40, 20, .3);
}
.ry-head h2 { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.3rem; letter-spacing: .14em; }
.ry-list { list-style: none; padding: 4px 18px 8px; }
.ry-list li {
  display: flex; align-items: baseline; gap: 10px; padding: 11px 0;
  border-top: 1px dashed #e2dccb; font-size: .95rem;
}
.ry-list li:first-child { border-top: 0; }
.ry-list .ten { flex: 1; min-width: 12px; border-bottom: 2px dotted #d6cdb8; transform: translateY(-4px); }
.ry-list .en { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.45rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ry-list .en small { font-family: "M PLUS Rounded 1c", sans-serif; font-size: .72rem; font-weight: 500; color: var(--usu); margin-left: 3px; }

a:focus-visible { outline: 3px solid var(--kin-hi); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="e" aria-hidden="true"></div>

<main class="waku">
  <h1 class="logo">
    <img src="./title-logo.png" width="900" height="242" alt="ひな将棋">
  </h1>

  <a class="enter" href="./hina.html">Enter</a>

  <section class="ryoukin" aria-labelledby="ry-title">
    <div class="ry-head">
      <span class="ry-han" aria-hidden="true">料金</span>
      <h2 id="ry-title">将棋教室</h2>
    </div>
    <ul class="ry-list" id="ry-list"></ul>
  </section>
</main>

<script>
/* 料金表。値段が変わったらここだけ直す */
const RYOUKIN = [
  ['席料', 500],
  ['回数券（8＋1回）', 4000],
  ['月例会', 600],
  ['リーグ戦', 300],
  ['研究会', 500],
  ['師範指導', 1500]
];
(function () {
  const ul = document.getElementById('ry-list');
  for (const [name, yen] of RYOUKIN) {
    const li = document.createElement('li');
    const n = document.createElement('span');
    n.textContent = name;
    const ten = document.createElement('span');
    ten.className = 'ten';
    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = yen.toLocaleString('ja-JP');
    const u = document.createElement('small');
    u.textContent = '円';
    en.appendChild(u);
    li.append(n, ten, en);
    ul.appendChild(li);
  }
})();
</script>
</body>
</html>
