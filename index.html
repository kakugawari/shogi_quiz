      '1958 大山康晴', '1959 大山康晴', '1960 大山康晴', '1961 大山康晴'
      ] }
  ];

  /* いま (2026年9月) の保持者と、その人がその棋戦で取った通算の期数。
     出どころの一覧表をそのまま写したもの。上の KISEN を数えた結果と合うかを
     titles.test.js が確かめる。**1 つの列の歴史ぜんぶを裏取りできる**ので、
     新しい年度を足すときや、写しまちがいを疑ったときの答え合わせに使う。
     next は次回の防衛戦の予定。これが翌年になっている棋戦だけ、その年度は
     もう終わっている (だから2026年度は名人・叡王・王位・王座・棋聖の5つが入っている) */
  const GENZAI = { asOf: 2026, list: [
    { key: 'ryuou',  name: '藤井聡太', ki: 5, next: '2026年10月〜' },
    { key: 'meijin', name: '藤井聡太', ki: 4, next: '2027年4月〜' },
    { key: 'eiou',   name: '伊藤匠',   ki: 3, next: '2027年4月〜' },
    { key: 'oui',    name: '藤井聡太', ki: 7, next: '2027年7月〜' },
    { key: 'ouza',   name: '広瀬章人', ki: 1, next: '2027年9月〜' },
    { key: 'kisei',  name: '藤井聡太', ki: 7, next: '2027年6月〜' },
    { key: 'kiou',   name: '藤井聡太', ki: 4, next: '2027年2月〜' },
    { key: 'oushou', name: '藤井聡太', ki: 5, next: '2027年1月〜' }
  ] };

  /* '1994後 羽生善治' を { year: 1994, term: '後', name: '羽生善治' } にほどく。
     書き方がくずれていたらここで止める (静かに変な形が通らないように)。 */
  const TITLES = KISEN.map((k) => {
    const holders = k.rows.map((row) => {
      const m = /^(\d{4})(前|後)?\s(\S+)$/.exec(row);
      if (!m) throw new Error(k.name + ': 行の書き方がちがう: ' + row);
      return { year: Number(m[1]), term: m[2] || '', name: m[3] };
    });
    return { key: k.key, name: k.name, kana: k.kana, note: k.note,
             gaps: k.gaps || {}, holders: holders };
  });

  return { TITLES: TITLES, GENZAI: GENZAI };
});

/*!
 * 年表の画面。
 */
(function () {
  'use strict';

  const T = window.Titles;
  const $ = (id) => document.getElementById(id);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* ============================================================
     年表 (歴代タイトルホルダー)
     ============================================================ */

  let nenpyoTab = null;

  /** 同じ人が続いたところを 1 かたまりにまとめる (「4連覇」と見せるため)。
      年がとんでいるところではまとめない (続けて取ったわけではないので)。 */
  function runsOf(holders) {
    const runs = [];
    for (const h of holders) {
      const run = runs[runs.length - 1];
      const prev = run && run.rows[run.rows.length - 1];
      const tsuzuki = prev && (h.year === prev.year || h.year === prev.year + 1);
      if (run && run.name === h.name && tsuzuki) run.rows.push(h);
      else runs.push({ name: h.name, rows: [h] });
    }
    return runs;
  }

  /** 通算で何期取ったか。多い順に。 */
  function tallyOf(holders) {
    const n = {};
    for (const h of holders) n[h.name] = (n[h.name] || 0) + 1;
    return Object.keys(n).map((name) => ({ name: name, ki: n[name] }))
      .sort((a, b) => b.ki - a.ki || a.name.localeCompare(b.name));
  }

  /* いまある八大タイトル。表に横に並べる順番 */
  /* いまある八大タイトル。表に横に並べる順番 (もらった表と同じ) */
  const GRID = ['ryuou', 'meijin', 'eiou', 'oui', 'ouza', 'kiou', 'oushou', 'kisei'];
  /* 姓が 1 文字の人。ここに無い人は姓を 2 文字とみなす。
     日本人の名前は姓が 1〜2 文字で、名前の長さからは決められないので表で持つ。
     */
  const SEI1 = ['南芳一', '森雞二'];

  /**
   * 表のマスに置く名前。姓と名で行を分ける。
   * 幅まかせに折り返すと「森雞 / 二」「加藤一 / 二三」と、変なところで切れる。
   */
  function nameSpan(name) {
    if (name.length < 3) return el('span', 'n-nm', name);
    const sei = SEI1.indexOf(name) >= 0 ? 1 : 2;
    const gyou = [name.slice(0, sei), name.slice(sei)];
    // 3 文字の行はそのままだとマスからはみ出すので、その札だけ字を小さくする
    const nm = el('span', 'n-nm' + (gyou.some((g) => g.length >= 3) ? ' is-long' : ''));
    for (const g of gyou) nm.appendChild(el('span', null, g));
    return nm;
  }

  /* 色は 3 段。多すぎると、かえって時代のかたまりが見えなくなる。
       KOI  … 何十回も取って時代を作った人。1人ずつちがう色で、字にも色を付ける
       MAMORU … 同じタイトルを 2 年つづけて守った (防衛した) ことがある人。
                だれも同じうすい色。個人を見分けるためではなく「一度きりではない」
                ことを示すため
       白    … 一度取っただけで、守れなかった人
     伊藤匠だけは 4 回だが、藤井聡太の八冠をくずした人なので KOI に入れている。
     だれが防衛したかは下の per (年度→名前) から数えるので、書き足す手間はない */
  const KOI = {
    羽生善治: ['#f8c9c5', '#a52b20'],   // 紅
    大山康晴: ['#f2dcac', '#7a5510'],   // 黄土
    中原誠:   ['#dcd0ef', '#4e3880'],   // 藤
    藤井聡太: ['#fbeca0', '#6d5900'],   // 黄
    渡辺明:   ['#cde5c9', '#2d6a32'],   // 若草
    谷川浩司: ['#c6e5ea', '#14606b'],   // 浅葱
    伊藤匠:   ['#c6d8f2', '#1b4a8d'],   // 青
    佐藤康光: ['#f2cee3', '#8c3470'],   // 桃紫
    米長邦雄: ['#dee3b8', '#5a6215'],   // 抹茶
    森内俊之: ['#c6e3dc', '#1d5f55']    // 青緑
  };
  const MAMORU = '#ebe3d2';             // 防衛したことがある人の、共通のうすい色

  /** 棋戦ごとに「年度 → 名前」を作る。棋聖戦の前期・後期は後期のほうを使う。 */
  function gridRows() {
    const per = {};
    let lo = Infinity, hi = -Infinity;
    for (const key of GRID) {
      const t = T.TITLES.find((x) => x.key === key);
      const m = new Map();
      for (const h of t.holders) m.set(h.year, h.name);   // 後期が前期を上書きする
      m.saigo = t.holders[t.holders.length - 1].year;     // この棋戦が入っている最後の年度
      per[key] = m;
      lo = Math.min(lo, t.holders[0].year);
      hi = Math.max(hi, t.holders[t.holders.length - 1].year);
    }
    const years = [];
    for (let y = lo; y <= hi; y++) years.push(y);
    return { per: per, years: years };
  }

  function buildNenpyoAll() {
    const list = $('nenpyo-list');
    list.innerHTML = '';
    const { per, years } = gridRows();

    // 何回取ったか / 同じタイトルを守ったことがあるかを数える
    const count = {};
    const mamotta = {};
    for (const key of GRID) {
      for (const name of per[key].values()) count[name] = (count[name] || 0) + 1;
      for (const [year, name] of per[key]) if (per[key].get(year + 1) === name) mamotta[name] = true;
    }
    const rank = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b));

    $('nenpyo-note').textContent =
      'いま行われている8つのタイトルを、横にならべた年表。新しい年が上だよ。'
      + '「まだ」は、これから指すか、まだ決まっていないところ';
    $('nenpyo-count').textContent = years.length + '年ぶん';
    $('nenpyo-range').textContent =
      years[years.length - 1] + '年度 〜 ' + years[0] + '年度。マスをおすと、大きな字で出るよ。'
      + '棋聖戦は1994年度まで年2回あったので、ここでは後期を出している';

    const table = el('table', 'n-grid');
    const head = el('tr');
    head.appendChild(el('th', 'n-gh n-gy', '年度'));
    for (const key of GRID) head.appendChild(el('th', 'n-gh', T.TITLES.find((t) => t.key === key).name));
    table.appendChild(el('thead')).appendChild(head);

    const body = el('tbody');
    for (let i = years.length - 1; i >= 0; i--) {     // 新しい年が上
      const year = years[i];
      const tr = el('tr');
      tr.appendChild(el('th', 'n-gy', String(year)));
      for (const key of GRID) {
        const name = per[key].get(year);
        if (!name) {
          // 「その棋戦がまだ無かった年」と「これから指す年」は別もの。見た目も分ける
          if (year > per[key].saigo) tr.appendChild(el('td', 'n-mada', 'まだ'));
          else tr.appendChild(el('td', 'n-none'));
          continue;
        }
        const td = el('td', 'n-cell');
        if (KOI[name]) { td.style.background = KOI[name][0]; td.style.color = KOI[name][1]; }
        else if (mamotta[name]) td.style.background = MAMORU;
        // 何年つづけて持っているか (押したときに「N連覇」と出すため)
        let from = year;
        while (per[key].get(from - 1) === name) from--;
        let to = year;
        while (per[key].get(to + 1) === name) to++;
        td.dataset.name = name;
        td.dataset.from = from;
        td.dataset.to = to;
        td.dataset.kisen = T.TITLES.find((t) => t.key === key).name;
        td.appendChild(nameSpan(name));
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
    table.appendChild(body);
    const wrap = el('div', 'n-grid-wrap');
    wrap.appendChild(table);
    list.appendChild(wrap);

    // 色を付けた人の一覧
    list.appendChild(el('div', 'zukan-fam', '時代を作った人'));
    const legend = el('ul', 'n-legend');
    for (const name of rank) {
      if (!KOI[name]) continue;
      const li = el('li');
      const chip = el('span', 'n-chip');
      chip.style.background = KOI[name][0];
      chip.style.borderColor = KOI[name][1];
      li.appendChild(chip);
      li.appendChild(el('span', 'n-name', name));
      li.appendChild(el('span', 'n-ki', count[name] + '回'));
      legend.appendChild(li);
    }
    list.appendChild(legend);

    const mamoruNin = rank.filter((n) => !KOI[n] && mamotta[n]).length;
    const shiroNin = rank.filter((n) => !KOI[n] && !mamotta[n]).length;
    const p2 = el('p', 'n-shiro');
    const chip2 = el('span', 'n-chip n-chip-in');
    chip2.style.background = MAMORU;
    p2.appendChild(chip2);
    p2.appendChild(document.createTextNode(
      'このうすい色は、同じタイトルを2年つづけて守ったことがある ' + mamoruNin + '人。'
      + '一度取っただけの ' + shiroNin + '人は白のままだよ'));
    list.appendChild(p2);

    table.addEventListener('click', (e) => {
      const td = e.target.closest('.n-cell');
      if (!td) return;
      const prev = table.querySelector('.is-pick');
      if (prev) prev.classList.remove('is-pick');
      td.classList.add('is-pick');
      const from = Number(td.dataset.from);
      const to = Number(td.dataset.to);
      const n = to - from + 1;
      const pick = $('nenpyo-pick');
      pick.hidden = false;
      pick.textContent = (n > 1 ? from + '〜' + to + '年度' : from + '年度')
        + '　' + td.dataset.kisen + '　' + td.dataset.name
        + (n > 1 ? '（' + n + '連覇）' : '');
    });
  }

  function buildNenpyo(key) {
    const title = T.TITLES.find((t) => t.key === key) || T.TITLES[0];
    const list = $('nenpyo-list');
    list.innerHTML = '';
    $('nenpyo-note').textContent = title.note;
    const from = title.holders[0].year;
    const to = title.holders[title.holders.length - 1].year;
    $('nenpyo-count').textContent = title.holders.length + '回ぶん';
    $('nenpyo-range').textContent =
      to + '年度 〜 ' + from + '年度、' + title.holders.length + '回ぶん。新しい年が上だよ。'
      + 'タイトル戦になる前（一般棋戦だったころ）は入れていないよ';

    const line = el('ol', 'nenpyo');
    const items = [];              // まず古い順に作って、最後にひっくり返す
    let prevYear = null;
    for (const run of runsOf(title.holders)) {
      const first = run.rows[0];
      const last = run.rows[run.rows.length - 1];

      // 年がとんでいるところには、その理由を書いた札をはさむ
      if (prevYear !== null) {
        for (let y = prevYear + 1; y < first.year; y++) {
          const why = title.gaps[y];
          const gap = el('li', 'n-gap');
          gap.appendChild(el('b', null, String(y)));
          gap.appendChild(document.createTextNode(why || 'この年度は行われていない'));
          items.push(gap);
        }
      }
      prevYear = last.year;

      // 1 年に 1 行ずつ出す。まとめてしまうと、取った回数より少なく見えるため。
      // 連覇はひとつづきに見えるよう、札の左に帯を引く。印は、上から読んで
      // さいしょに目に入るところ = その連覇のいちばん新しい年に付ける
      const renpa = run.rows.length > 1;
      run.rows.forEach((h, i) => {
        const ue = i === run.rows.length - 1;     // ひっくり返すと、ここが上にくる
        const li = el('li', 'n-row' + (renpa ? ' is-run' : '')
          + (renpa && ue ? ' is-run-top' : '')
          + (renpa && i === 0 ? ' is-run-bottom' : ''));
        const years = el('span', 'n-year');
        years.appendChild(el('b', null, String(h.year) + h.term));
        li.appendChild(years);
        const body = el('span', 'n-body');
        body.appendChild(el('span', 'n-name', run.name));
        if (renpa && ue) body.appendChild(el('span', 'n-renpa', run.rows.length + '連覇'));
        li.appendChild(body);
        items.push(li);
      });
    }
    // 新しい年が上。「ぜんぶ」の表と向きをそろえる
    for (let i = items.length - 1; i >= 0; i--) line.appendChild(items[i]);
    list.appendChild(line);

    // 通算獲得数は holders から数える (書き足したら勝手に合う)
    const tally = tallyOf(title.holders).slice(0, 8);
    list.appendChild(el('div', 'zukan-fam', '通算で多い人'));
    const top = el('ul', 'n-tally');
    for (const t of tally) {
      const li = el('li');
      li.appendChild(el('span', 'n-name', t.name));
      li.appendChild(el('span', 'n-ki', t.ki + '回'));
      top.appendChild(li);
    }
    list.appendChild(top);
  }

  function showNenpyo(key) {
    nenpyoTab = key || nenpyoTab || 'all';
    const tabs = $('nenpyo-tabs');
    tabs.innerHTML = '';
    const list = [{ key: 'all', name: 'ぜんぶ' }].concat(T.TITLES);
    for (const t of list) {
      const b = el('button', 'tab' + (t.key === nenpyoTab ? ' is-on' : ''), t.name);
      b.type = 'button';
      b.dataset.tab = t.key;
      b.addEventListener('click', () => showNenpyo(t.key));
      tabs.appendChild(b);
    }
    $('nenpyo-pick').hidden = true;
    if (nenpyoTab === 'all') buildNenpyoAll();
    else buildNenpyo(nenpyoTab);
  }

  showNenpyo('all');
  window.__nenpyo = { show: showNenpyo, SEI1: SEI1 };
})();
</script>
