<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひな将棋</title>
<meta name="description" content="ひなの将棋の記録。級の歴史、リーグ戦の勝率チェック、タイトル年表">
<meta name="theme-color" content="#141a3a">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ひな将棋">
<!-- ホーム画面に追加して開いたとき、時計や電池の帯の下まで画面を描く (app_template と同じ)。
     無いと iOS は帯の下からページを始め、帯を theme-color の板で塗る。
     上の安全域は site.css の env(safe-area-inset-top) で空けてある。
     iOS は追加したときの設定を覚えているので、前に追加したアイコンは作り直さないと変わらない -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   タイトル画面。アイコンと同じ紺の盤と駒の絵を地にして、
   白い筆文字の「ひな将棋」と、教室の料金表をのせる。
   =========================================================== */
:root {
  --kon: #141a3a;          /* 地の紺 (アイコンと同じ) */
  --kon-2: #1d2552;
  --kin: #c9a65a;          /* 金のふち */
  --kin-hi: #e6cc8c;
  --kami: #fbf8f0;         /* 料金表の紙 */
  --sumi: #22284a;         /* 料金表の字 (紺がかった墨) */
  --usu: #8a8072;
  --shu: #c4553e;          /* 「料金」の判 */
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* 対象は iPhone 16 Plus (430 x 932pt) だけ (app_template の決めごと)。
   ホーム画面から開くと、% や dvh で数えた高さが上の安全域ぶん足りない (873) ことがあるので、
   根っこを 100vh (932) にして position: relative を付け、全画面の物はその中に absolute で置く。
   この画面はすべらせないので、時計の帯の下まで絵を敷き、帯をふさぐ板は置かない */
html, body { height: 100vh; position: relative; overflow: hidden; overscroll-behavior: none; }
html { background: var(--kon); }
body {
  color: #f4efe2;
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  font-weight: 700;
  background: radial-gradient(120% 70% at 50% 0, var(--kon-2), var(--kon) 70%) fixed, var(--kon);
}
.e {                       /* 盤と駒の絵。ふちを紺にぼかして、地になじませる */
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: 100%; height: 66vh;   /* 16 Plus の縦長の画面に合わせて、絵を上の 3 分の 2 まで広げる */
  background: url(./title-bg.jpg) center / cover no-repeat;
  -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 98%);
          mask-image: linear-gradient(180deg, #000 60%, transparent 98%);
  pointer-events: none;
}
.waku {                    /* 金のふち。アイコンと同じ角丸の額。中身といっしょにのびる */
  position: absolute; left: 8px; right: 8px;
  top: calc(env(safe-area-inset-top) + 2px); bottom: calc(env(safe-area-inset-bottom) + 6px);
  padding: 10px 12px 18px;
  border: 2px solid rgba(201, 166, 90, .85); border-radius: 28px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 1px rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; align-items: center;
}

/* ---------------- ロゴ ---------------- */
/* ロゴは、料金表より上の空きのまん中に置く (上下の auto で空きを分ける) */
.logo { margin-top: auto; width: min(96%, 470px); text-align: center; animation: fude .9s cubic-bezier(.2, .8, .3, 1) both; }
.logo img { display: block; width: 100%; height: auto; }
@keyframes fude { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------------- どこでもタップ ---------------- */
/* 画面ぜんたいが「ひなの歴史」へのリンク。ボタンは置かない */
a.waku { text-decoration: none; color: inherit; cursor: pointer; }
.tap { margin: 14px 0 auto; font-size: .7rem; letter-spacing: .4em; text-indent: .4em; color: rgba(230, 204, 140, .55);
  animation: rise .6s .3s both, iki 2.8s 1.2s ease-in-out infinite; }
@keyframes iki { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------------- 料金表 ---------------- */
/* 白い紙だと紺の地の上で光って見えるので、紺のすりガラスに金の線と生成りの字にする */
.ryoukin {
  width: 340px; margin-top: 22px; color: #e9e2cf;   /* 項目と金額が離れすぎないよう、はばをしぼる */
  background: linear-gradient(180deg, rgba(29, 37, 82, .78), rgba(16, 21, 50, .86));
  border: 1px solid rgba(201, 166, 90, .55); border-radius: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(230, 204, 140, .12);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: rise .6s .4s both;
}
.ry-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px 10px; border-bottom: 1px solid rgba(201, 166, 90, .35); }
.ry-han {
  width: 30px; height: 30px; border-radius: 7px; flex: none; display: grid; place-items: center;
  background: #9c4232; color: #f6e9dc; font-family: "Shippori Mincho B1", serif; font-size: .74rem; line-height: 1;
}
.ry-head h2 { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.3rem; letter-spacing: .14em; color: var(--kin-hi); font-weight: 700; }
.ry-list { list-style: none; padding: 0 18px 8px; }
.ry-list li {
  display: flex; align-items: baseline; gap: 10px; padding: 9px 0;
  border-top: 1px dashed rgba(201, 166, 90, .18); font-size: 1.05rem;
}
.ry-list li:first-child { border-top: 0; }
.ry-list .ten { flex: 1; min-width: 16px; border-bottom: 2px dotted rgba(201, 166, 90, .3); transform: translateY(-4px); }
.ry-list .en { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.45rem; line-height: 1; font-variant-numeric: tabular-nums; color: #f4efe2; }
.ry-list .en small { font-family: "M PLUS Rounded 1c", sans-serif; font-size: .8rem; font-weight: 500; color: #a9a08a; margin-left: 3px; }

a:focus-visible { outline: 3px solid var(--kin-hi); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="e" aria-hidden="true"></div>

<a class="waku" href="./hina.html" aria-label="ひな将棋。おすと、ひなの歴史がひらく">
  <h1 class="logo">
    <img src="./title-logo.png" width="900" height="262" alt="ひな将棋">
  </h1>

  <p class="tap" aria-hidden="true">タップしてひらく</p>

  <section class="ryoukin" aria-labelledby="ry-title">
    <div class="ry-head">
      <span class="ry-han" aria-hidden="true">料金</span>
      <h2 id="ry-title">将棋教室</h2>
    </div>
    <ul class="ry-list" id="ry-list"></ul>
  </section>
</a>

<script>
/* 料金表。値段が変わったらここだけ直す */
const RYOUKIN = [
  ['席料', 500],
  ['回数券（8＋1回）', 4000],
  ['月例会', 600],
  ['リーグ戦', 300],
  ['研究会', 500],
  ['師範指導', 1500]
];
(function () {
  const ul = document.getElementById('ry-list');
  for (const [name, yen] of RYOUKIN) {
    const li = document.createElement('li');
    const n = document.createElement('span');
    n.textContent = name;
    const ten = document.createElement('span');
    ten.className = 'ten';
    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = yen.toLocaleString('ja-JP');
    const u = document.createElement('small');
    u.textContent = '円';
    en.appendChild(u);
    li.append(n, ten, en);
    ul.appendChild(li);
  }
})();
</script>
</body>
</html>
